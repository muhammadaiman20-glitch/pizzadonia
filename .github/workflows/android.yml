name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'tailwind.config.js'
      - 'postcss.config.js'
      - 'tsconfig*.json'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}

      # Jika tiada keystore sedia ada, kunci debug yang sama dikekalkan antara
      # build supaya APK baru masih boleh dipasang sebagai kemas kini.
      - name: Cache debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        env:
          VITE_API_BASE: https://pizzadonia.muhammadaiman20.workers.dev/api
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      # Membina APK bertandatangan dengan keystore sedia ada jika secret
      # ANDROID_KEYSTORE_BASE64 disediakan. Jika tidak, APK debug dihasilkan.
      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          fi
          chmod +x gradlew
          GRADLE_ARGS=(-PversionCode="${VERSION_CODE}" -PversionName="${VERSION_NAME}")

          if [ -n "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "Building signed release APK with existing keystore"
            echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > app/keystore.jks
            export ANDROID_KEYSTORE_PATH="$PWD/app/keystore.jks"
            export ANDROID_KEYSTORE_PASSWORD="${ANDROID_KEYSTORE_PASSWORD}"
            export ANDROID_KEY_ALIAS="${ANDROID_KEY_ALIAS}"
            export ANDROID_KEY_PASSWORD="${ANDROID_KEY_PASSWORD}"
            ./gradlew assembleRelease --no-daemon "${GRADLE_ARGS[@]}"
            APK_PATH=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set; building debug APK. To update an existing install, provide the original signing keystore in repository secrets."
            ./gradlew assembleDebug --no-daemon "${GRADLE_ARGS[@]}"
            APK_PATH=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          fi

          cp "${APK_PATH}" "../Pizzadonia-${VERSION_NAME}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pizzadonia-APK-${{ github.run_number }}
          path: Pizzadonia-*.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Pizzadonia-*.apk
