apply plugin: 'com.android.application'

// Versi app diambil daripada package.json (satu sumber kebenaran). Nilai
// boleh ditindih melalui -PversionName / VERSION_NAME semasa build.
def packageJsonFile = rootProject.file('../package.json')
def packageVersion = '1.0.0'
if (packageJsonFile.exists()) {
    try {
        packageVersion = new groovy.json.JsonSlurper().parseText(packageJsonFile.text).version ?: packageVersion
    } catch (Exception ignored) {
        logger.warn("Tidak dapat membaca versi daripada package.json; guna ${packageVersion}")
    }
}

// versionCode mesti sentiasa meningkat supaya Android menerima kemas kini.
// Lalai: cap masa Unix (saat). GitHub Actions membekalkan VERSION_CODE.
def defaultVersionCode = (System.currentTimeMillis() / 1000L).toInteger()
def appVersionCode = (project.findProperty('versionCode') ?: System.getenv('VERSION_CODE') ?: defaultVersionCode).toInteger()
def appVersionName = project.findProperty('versionName') ?: System.getenv('VERSION_NAME') ?: packageVersion

// Kunci tandatangan sedia ada. Isi melalui pemboleh ubah persekitaran
// (GitHub Secrets) atau -P pada command line. Jika tiada, build guna
// debug key biasa.
def keystorePath = project.findProperty('ANDROID_KEYSTORE_PATH') ?: System.getenv('ANDROID_KEYSTORE_PATH')
def keystorePassword = project.findProperty('ANDROID_KEYSTORE_PASSWORD') ?: System.getenv('ANDROID_KEYSTORE_PASSWORD')
def keystoreAlias = project.findProperty('ANDROID_KEY_ALIAS') ?: System.getenv('ANDROID_KEY_ALIAS')
def keystoreKeyPassword = project.findProperty('ANDROID_KEY_PASSWORD') ?: System.getenv('ANDROID_KEY_PASSWORD')
def hasKeystore = keystorePath && new File(keystorePath).exists()

android {
    namespace = "com.pizzadonia.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.pizzadonia.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    flavorDimensions += "app"
    productFlavors {
        // App pelanggan — laman kedai sahaja.
        customer {
            dimension "app"
        }
        // App penjual — terus membuka dashboard pada /seller.html.
        seller {
            dimension "app"
            applicationId "com.pizzadonia.seller"
        }
    }
    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias keystoreAlias
                keyPassword keystoreKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
