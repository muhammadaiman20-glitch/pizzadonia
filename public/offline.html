<!doctype html>
<html lang="ms">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f1e6" />
    <title>Tidak dapat hubungi pelayan — Pizzadonia</title>
    <style>
      :root {
        color-scheme: light;
        --cream: #f7f1e6;
        --paper: #fffdf8;
        --ink: #2b2118;
        --muted: #7c6f60;
        --tomato: #d9482b;
        --line: #e8ddcc;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--cream);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      main {
        width: 100%;
        max-width: 380px;
        border: 1px solid var(--line);
        border-radius: 24px;
        background: var(--paper);
        padding: 24px;
        box-shadow: 0 18px 40px -24px rgba(43, 33, 24, 0.4);
      }
      .badge {
        display: grid;
        place-items: center;
        width: 52px;
        height: 52px;
        border-radius: 16px;
        background: rgba(217, 72, 43, 0.12);
        color: var(--tomato);
        font-size: 26px;
        font-weight: 800;
      }
      h1 { margin: 16px 0 8px; font-size: 20px; line-height: 1.25; }
      p { margin: 0 0 10px; font-size: 13px; line-height: 1.6; color: var(--muted); }
      .hint {
        border-radius: 12px;
        background: var(--cream);
        padding: 10px 12px;
        font-size: 12px;
        color: var(--ink);
      }
      .actions { display: grid; gap: 8px; margin-top: 18px; }
      button {
        width: 100%;
        min-height: 44px;
        border: 0;
        border-radius: 12px;
        background: var(--tomato);
        color: #fff;
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }
      button.secondary {
        background: transparent;
        border: 1px solid var(--line);
        color: var(--ink);
      }
      button:active { transform: scale(0.99); }
      .status {
        margin-top: 12px;
        font-size: 10px;
        letter-spacing: 0.02em;
        color: var(--muted);
        word-break: break-all;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="badge" aria-hidden="true">🍕</div>
      <h1>Tidak dapat hubungi pelayan</h1>
      <p>
        App tidak dapat mencari alamat pelayan. Ini biasanya masalah DNS atau sambungan
        internet pada peranti.
      </p>
      <p class="hint">
        Cuba tukar antara Wi-Fi dan data mudah alih, hidupkan semula telefon, atau tetapkan
        DNS telefon kepada <b>1.1.1.1</b>.
      </p>
      <div class="actions">
        <button type="button" id="retry">Cuba lagi</button>
        <button type="button" class="secondary" id="fallback">Buka alamat sandaran</button>
      </div>
      <p class="status" id="status"></p>
    </main>
    <script>
      ;(function () {
        var PRIMARY = 'https://pizzadonia.pages.dev/'
        var FALLBACK = 'https://pizzadonia.muhammadaiman20.workers.dev/'

        document.getElementById('status').textContent = PRIMARY
        document.getElementById('retry').addEventListener('click', function () {
          window.location.replace(PRIMARY)
        })
        document.getElementById('fallback').addEventListener('click', function () {
          document.getElementById('status').textContent = FALLBACK
          window.location.replace(FALLBACK)
        })
      })()
    </script>
  </body>
</html>
