<!doctype html>
<html lang="ms">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f2e23" />
    <title>Tidak dapat hubungi pelayan — Dashboard Penjual</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f2e23;
        --panel: #143b2d;
        --ink: #f3f7f2;
        --muted: #a9c3b5;
        --basil: #6fbf73;
        --line: #2a5544;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(circle at top, #1a4a38, var(--bg) 60%);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      main {
        width: 100%;
        max-width: 380px;
        border: 1px solid var(--line);
        border-radius: 24px;
        background: var(--panel);
        padding: 24px;
        box-shadow: 0 24px 60px -30px rgba(0, 0, 0, 0.8);
      }
      .badge {
        display: grid;
        place-items: center;
        width: 52px;
        height: 52px;
        border-radius: 16px;
        background: rgba(111, 191, 115, 0.16);
        font-size: 26px;
      }
      p { margin: 0 0 10px; font-size: 13px; line-height: 1.6; color: var(--muted); }
      h1 { margin: 16px 0 8px; font-size: 20px; line-height: 1.25; }
      .hint {
        border-radius: 12px;
        background: rgba(111, 191, 115, 0.1);
        padding: 10px 12px;
        font-size: 12px;
        color: var(--ink);
      }
      .actions { display: grid; gap: 8px; margin-top: 18px; }
      button {
        width: 100%;
        min-height: 44px;
        border: 0;
        border-radius: 12px;
        background: var(--basil);
        color: #082016;
        font: inherit;
        font-size: 13px;
        font-weight: 800;
        cursor: pointer;
      }
      button.secondary {
        background: transparent;
        border: 1px solid var(--line);
        color: var(--ink);
      }
      button:active { transform: scale(0.99); }
      .status {
        margin-top: 12px;
        font-size: 10px;
        color: var(--muted);
        word-break: break-all;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="badge" aria-hidden="true">🏪</div>
      <h1>Tidak dapat hubungi pelayan</h1>
      <p>
        Dashboard penjual tidak dapat mencari alamat pelayan. Ini biasanya masalah DNS
        atau sambungan internet pada peranti.
      </p>
      <p class="hint">
        Cuba tukar antara Wi-Fi dan data mudah alih, hidupkan semula telefon, atau tetapkan
        DNS telefon kepada <b>1.1.1.1</b>.
      </p>
      <div class="actions">
        <button type="button" id="retry">Cuba lagi</button>
        <button type="button" class="secondary" id="fallback">Buka alamat sandaran</button>
      </div>
      <p class="status" id="status"></p>
    </main>
    <script>
      ;(function () {
        var PRIMARY = 'https://pizzadonia.pages.dev/seller'
        var FALLBACK = 'https://pizzadonia.muhammadaiman20.workers.dev/seller'

        document.getElementById('status').textContent = PRIMARY
        document.getElementById('retry').addEventListener('click', function () {
          window.location.replace(PRIMARY)
        })
        document.getElementById('fallback').addEventListener('click', function () {
          document.getElementById('status').textContent = FALLBACK
          window.location.replace(FALLBACK)
        })
      })()
    </script>
  </body>
</html>
